  <g id="heading" data-pptx-bounds="72 62 1130 118"><text x="80" y="94" font-size="22" fill="#80C7C2">05 / THE FAIR TEST</text><text x="80" y="155" font-size="50" font-weight="bold" fill="#F7F9FC">Two comparisons, two different claims</text></g>
  <g id="application-controls" data-pptx-bounds="75 210 542 278">
    <text x="85" y="248" font-size="28" font-weight="bold" fill="#80C7C2">1 / APPLICATION VALUE</text>
    <text x="85" y="305" font-size="28" fill="#F7F9FC">Persistence</text>
    <text x="85" y="350" font-size="28" fill="#F7F9FC">Raw inputs + quantile head</text>
    <text x="85" y="395" font-size="28" fill="#F7F9FC">Random Fourier features + same head</text>
    <text x="85" y="440" font-size="28" fill="#F7F9FC">Strong lag-based quantile XGBoost</text>
  </g>
  <g id="interference-controls" data-pptx-bounds="682 210 520 278">
    <text x="700" y="248" font-size="28" font-weight="bold" fill="#E1BA82">2 / INTERFERENCE CONTRIBUTION</text>
    <text x="700" y="305" font-size="28" fill="#F7F9FC">Indistinguishable photons</text><text x="700" y="350" font-size="28" fill="#F7F9FC">versus distinguishable photons</text>
    <path d="M 700 375 L 1020 378 L 1150 374" fill="none" stroke="#E1BA82" stroke-width="2.5"/>
    <text x="700" y="417" font-size="22" fill="#E7EDF4">Same inputs, circuit and readout policy.</text><text x="700" y="457" font-size="22" fill="#E7EDF4">Select on validation; freeze before test.</text>
  </g>
  <g id="registered-gate" data-pptx-bounds="75 498 1125 137">
    <path d="M 85 514 L 1191 511" fill="none" stroke="#80C7C2" stroke-width="2"/>
    <text x="85" y="550" font-size="28" fill="#80C7C2">Primary: normalized WIS ↓ · skill = 1 − WIS(system) / WIS(B)</text>
    <text x="85" y="585" font-size="22" fill="#E7EDF4">Calibration: 90% coverage + normalized width · Cost: runtime + peak RAM</text>
    <text x="85" y="622" font-size="22" fill="#E1BA82">GO: lower 95% CI of skill &gt;2%; 90% coverage in 85–95%; resource gates pass.</text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="72 641 1132 36"><text x="80" y="665" font-size="16" fill="#E7EDF4">Source: approved protocol · B selected on validation · Paired day-block bootstrap · Criteria, not model results</text><text x="1195" y="665" font-size="16" fill="#E7EDF4" text-anchor="end">06 / 10</text></g>
