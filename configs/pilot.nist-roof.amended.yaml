# NIST source metadata follow the adopted issue-log protocol amendment.
# Human G0 approval remains required separately after quantitative audit.
# RefCell2 is a horizontal silicon reference cell, not thermopile GHI.
protocol:
  version: "1.1-issue-log-amendment"
  provenance: real
  approved_by: null
  approved_at: null
paths:
  # Explicit QC-valid projection; raw and QC sidecar remain separately inspectable.
  input_data: ../artifacts/nist/prepared/nist-roof.valid.parquet
  artifact_dir: ../artifacts/nist/pilot-amended
data:
  dataset: nist-roof
  format: parquet
  raw_cadence_minutes: 1
  timezone: UTC
  # Human cleaning effort remains unknown; never fabricate hours or lock status.
  cleaning: null
  columns:
    site: site_id
    timestamp: timestamp
    power: power_kw
    capacity: capacity_kw
    ghi: ghi_w_m2
    temperature: temperature_c
  availability:
    # Zero latency is an offline-analysis assumption, not measured deployment latency.
    power:
      fixed_latency_minutes: 0
    weather:
      fixed_latency_minutes: 0
target:
  interval_minutes: 5
  horizon_minutes: 15
split:
  train_end_utc: "2016-01-01T04:59:59Z"
  validation_end_utc: "2016-07-01T04:59:59Z"
  test_end_utc: "2017-01-01T04:59:59Z"
daylight:
  source: solar_elevation
  latitude: 39.1354
  longitude: -77.2156
features:
  matched_4_mode_power_lags_minutes: [0, 15]
  matched_6_mode_power_lags_minutes: [0, 5, 15, 60]
  include_current_ghi: true
  include_current_temperature: true
  strong_xgb_power_lags_minutes: [0, 5, 10, 15, 30, 60]
photonics:
  modes: [4]
  primary_photons: 2
  max_photons: 2
  enable_three_photon_profile: false
  enable_finite_shot_diagnostics: false
  backend: SLOS
  phase_scales: [1.5707963267948966, 3.141592653589793]
  raw_attempt_budgets: [1000, 10000]
models:
  quantile_alpha_grid: [0.0001, 0.001, 0.01, 0.1]
  rff:
    gamma_grid: [0.1, 1.0, 10.0]
    n_components: fock_dimension
  xgboost:
    max_depth_grid: [3, 6]
    learning_rate_grid: [0.03, 0.1]
    n_estimators: 300
    subsample: 1.0
    colsample_bytree: 1.0
    reg_lambda: 1.0
    tree_method: hist
    n_jobs: 1
    objective: reg:quantileerror
evaluation:
  quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
  bootstrap:
    block_days: 1
    sensitivity_block_days: [2, 7]
    replicates: 2000
    min_valid_blocks: 20
  minimum_relative_wis_skill: 0.02
  coverage_acceptance: [0.85, 0.95]
resources:
  max_wall_clock_seconds: 43200
  max_memory_gb: 24.0
  max_workers: 1
seeds:
  master_seed: 20260928
