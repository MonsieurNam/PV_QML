[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photonic-pv-pilot"
version = "0.1.0"
description = "A reproducible pilot for photonic quantum machine learning on photovoltaic data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "perceval-quandela==1.3.0",
    "psutil",
    "pvlib",
    "pyarrow",
    "pydantic",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "typer",
    "xgboost",
]

[project.scripts]
pv-pilot = "pv_pilot.cli:app"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pv_pilot"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["perceval", "perceval.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["psutil", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
